[workspace]
members = ["macros"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/viridia/bevy_action_map"

# Public documentation is part of the deliverable, so an undocumented `pub` item is a warning.
[workspace.lints.rust]
missing_docs = "warn"

[package]
name = "bevy_action_map"
description = "Input action mapping for Bevy: bindings, contexts, devices, and binding presentation"
keywords = ["bevy", "input", "gamepad", "keybindings"]
categories = ["game-development"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# Depend on Bevy subcrates rather than the umbrella: this crate is a candidate for eventual
# upstream inclusion, and R24.2 asks for a minimal dependency surface. Examples pull the full
# `bevy` via dev-dependencies instead.
[dependencies]
bevy_action_map_macros = { path = "macros", version = "0.1.0" }
bevy_app = { git = "https://github.com/bevyengine/bevy.git", default-features = false }
bevy_ecs = { git = "https://github.com/bevyengine/bevy.git", default-features = false }
bevy_input = { git = "https://github.com/bevyengine/bevy.git", default-features = false }
bevy_math = { git = "https://github.com/bevyengine/bevy.git", default-features = false }
bevy_time = { git = "https://github.com/bevyengine/bevy.git", default-features = false }
bevy_platform = { git = "https://github.com/bevyengine/bevy.git", default-features = false }
bevy_reflect = { git = "https://github.com/bevyengine/bevy.git", default-features = false, optional = true }
bevy_input_focus = { git = "https://github.com/bevyengine/bevy.git", default-features = false, optional = true }
bevy_state = { git = "https://github.com/bevyengine/bevy.git", default-features = false, optional = true }
serde = { version = "1", default-features = false, features = [
  "alloc",
  "derive",
], optional = true }
# The logging facade `bevy_input` uses, rather than `bevy_log`: that crate installs a
# `tracing-subscriber` and is `std`-only, while this is `no_std` and pulls nothing in behind it.
log = { version = "0.4", default-features = false }
# For `once!`, which is the `no_std` half of `bevy_log::warn_once!`. Already in the graph beneath
# `bevy_ecs`, so it costs a line here and nothing to build.
bevy_utils = { git = "https://github.com/bevyengine/bevy.git", default-features = false }

[dev-dependencies]
bevy = { git = "https://github.com/bevyengine/bevy.git", features = [
  "dynamic_linking",
] }
trybuild = "1.0"
# Picked as the concrete format for chunk 55's golden persistence test — a format this crate never
# learns about outside that one test (§10.1).
toml = "0.8"

[features]
default = ["std", "bevy_reflect", "keyboard", "mouse", "gamepad", "state"]

# The core mapping layer is no_std-capable (R24.1, R16.6).
std = [
  "bevy_app/std",
  "bevy_ecs/std",
  "bevy_input/std",
  "bevy_math/std",
  "bevy_platform/std",
  "bevy_state?/std",
  "bevy_time/std",
  "bevy_reflect?/std",
  "bevy_utils/std",
  "serde?/std",
]

# glam takes its math backend from a feature, and `std` is the one it gets by default. A `no_std`
# build has to name a replacement or glam refuses to compile at all, so check that configuration as
# `--no-default-features --features libm`.
libm = ["bevy_math/libm"]

# Input sources, mirroring bevy_input's own feature layout.
keyboard = ["bevy_input/keyboard"]
mouse = ["bevy_input/mouse"]
gamepad = ["bevy_input/gamepad"]
touch = ["bevy_input/touch"]

# Runtime reflection. Required to serialize custom modifiers/conditions (R5.6, R17.5).
bevy_reflect = [
  "dep:bevy_reflect",
  "bevy_app/bevy_reflect",
  "bevy_ecs/bevy_reflect",
  "bevy_input/bevy_reflect",
  "bevy_math/bevy_reflect",
  "bevy_time/bevy_reflect",
]

# Persistence of binding overrides and input frames (§17, R10.1).
serialize = ["dep:serde", "bevy_input/serialize", "bevy_math/serialize"]

# bevy_input_focus integration: focus-activated contexts, dispatch effects (D4, R22.10).
focus = ["dep:bevy_input_focus"]

# bevy_state integration: a context's activation follows a game state (R7.1, R7.7).
state = ["dep:bevy_state"]

# Deliberately absent: a `scene`/BSN feature. Transitions are plain `EntityEvent`s, so `bsn!`
# attaches observers with no adapter and no dependency either way (R22.15, R22.17).

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-Zunstable-options", "--generate-link-to-definition", "--cfg", "docsrs"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
