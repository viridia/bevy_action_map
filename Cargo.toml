[workspace]
members = ["crates/*"]
# A bare command at the root takes every member, not only the examples.
default-members = [".", "crates/*"]
resolver = "3"

# The examples, as a package of their own rather than the crate's: a crate built on
# `bevy_action_map` that they use would, as its dev-dependency, give its unit tests a second copy of
# its types. It has no library, and is here rather than in `examples/` so that `assets/` sits beside
# its manifest, where Bevy looks for it.
[package]
name = "bevy_action_map_examples"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bevy_action_map = { path = "crates/bevy_action_map" }
bevy_action_map_ui = { path = "crates/bevy_action_map_ui" }
# `bevy_settings` is not in the umbrella's default profiles. Split Friction is the only example
# that stores anything, and where a game puts its bytes is the app's decision (D53), so the crate
# itself knows nothing about it.
bevy = { workspace = true, features = [
  "dynamic_linking",
  "bevy_settings",
  # For the driver, below. The examples never name `bevy_remote` themselves, but the umbrella's
  # feature is what registers `Image`'s serialization, without which a screenshot step panics the
  # app rather than failing the step.
  "bevy_remote",
] }
bevy_input.workspace = true
bevy_math.workspace = true
# Every example adds `RemoteDriverPlugin`, which is inert unless the port variable is set, so a
# plan can drive any of them without the example knowing it is under test.
bevy_remote_driver = { path = "crates/bevy_remote_driver" }

[features]
serialize = ["bevy_action_map/serialize"]

# Declared rather than auto-discovered, for the one line that matters: each stores something, so
# each needs `serialize`, which is not a default feature.
[[example]]
name = "split_friction"
path = "examples/split_friction/main.rs"
required-features = ["serialize"]

[[example]]
name = "disasteroids"
path = "examples/disasteroids/main.rs"
required-features = ["serialize"]

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/viridia/bevy_action_map"

# Public documentation is part of the deliverable, so an undocumented `pub` item is a warning.
[workspace.lints.rust]
missing_docs = "warn"

# The Bevy pins, in one place. Subcrates are declared without default features, which a member that
# wants them turns back on; the umbrella keeps its defaults, and is only ever a dev-dependency or
# the examples'.
[workspace.dependencies]
bevy = { git = "https://github.com/bevyengine/bevy.git", branch = "main" }
bevy_app = { git = "https://github.com/bevyengine/bevy.git", branch = "main", default-features = false }
bevy_asset = { git = "https://github.com/bevyengine/bevy.git", branch = "main", default-features = false }
bevy_camera = { git = "https://github.com/bevyengine/bevy.git", branch = "main", default-features = false }
bevy_diagnostic = { git = "https://github.com/bevyengine/bevy.git", branch = "main", default-features = false }
bevy_ecs = { git = "https://github.com/bevyengine/bevy.git", branch = "main", default-features = false }
bevy_input = { git = "https://github.com/bevyengine/bevy.git", branch = "main", default-features = false }
bevy_math = { git = "https://github.com/bevyengine/bevy.git", branch = "main", default-features = false }
bevy_platform = { git = "https://github.com/bevyengine/bevy.git", branch = "main", default-features = false }
bevy_reflect = { git = "https://github.com/bevyengine/bevy.git", branch = "main", default-features = false }
bevy_remote = { git = "https://github.com/bevyengine/bevy.git", branch = "main", default-features = false }
bevy_scene = { git = "https://github.com/bevyengine/bevy.git", branch = "main", default-features = false }
bevy_state = { git = "https://github.com/bevyengine/bevy.git", branch = "main", default-features = false }
bevy_time = { git = "https://github.com/bevyengine/bevy.git", branch = "main", default-features = false }
bevy_ui = { git = "https://github.com/bevyengine/bevy.git", branch = "main", default-features = false }
bevy_utils = { git = "https://github.com/bevyengine/bevy.git", branch = "main", default-features = false }
bevy_window = { git = "https://github.com/bevyengine/bevy.git", branch = "main", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
