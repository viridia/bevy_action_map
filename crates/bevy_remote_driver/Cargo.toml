[package]
name = "bevy_remote_driver"
description = "Drive a running Bevy app from outside for automated tests, over the Bevy Remote Protocol"
keywords = ["bevy", "testing", "remote"]
categories = ["game-development", "development-tools::testing"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Subcrates rather than the umbrella, for the same reason as `bevy_action_map`: the server methods
# are candidates for upstream (DD8), and an app under test already has the umbrella.
[dependencies]
bevy_app = { workspace = true, default-features = true }
bevy_camera = { workspace = true, default-features = true }
bevy_diagnostic = { workspace = true, default-features = true }
bevy_ecs = { workspace = true, default-features = true }
bevy_reflect = { workspace = true, default-features = true }
bevy_remote = { workspace = true, features = ["http"] }
bevy_scene = { workspace = true, default-features = true }
bevy_ui = { workspace = true, default-features = true }
bevy_window = { workspace = true, default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
bevy = { workspace = true, features = ["dynamic_linking", "bevy_remote"] }
bevy_math = { workspace = true, default-features = true }
bevy_time = { workspace = true, default-features = true }
