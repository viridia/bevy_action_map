[package]
name = "bevy_action_map_ui"
description = "UI for bevy_action_map: drawing input prompts"
keywords = ["bevy", "input", "ui", "prompts"]
categories = ["game-development"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Only the glyph types, which every device configuration has.
bevy_action_map = { path = "../bevy_action_map", version = "0.1.0", default-features = false, features = [
  "std",
] }
bevy_asset.workspace = true
bevy_ecs.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-Zunstable-options", "--generate-link-to-definition", "--cfg", "docsrs"]
