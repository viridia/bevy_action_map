[package]
name = "bevy_remote_driver"
description = "Drive a running Bevy app from outside for automated tests, over the Bevy Remote Protocol"
keywords = ["bevy", "testing", "remote"]
categories = ["game-development", "development-tools::testing"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# Subcrates rather than the umbrella, for the same reason as `bevy_action_map`: the server methods
# are candidates for upstream (DD8), and an app under test already has the umbrella.
[dependencies]
bevy_app = "0.20.0-rc.1"
bevy_camera = "0.20.0-rc.1"
bevy_diagnostic = "0.20.0-rc.1"
bevy_ecs = "0.20.0-rc.1"
bevy_reflect = "0.20.0-rc.1"
bevy_remote = { version = "0.20.0-rc.1", default-features = false, features = ["http"] }
bevy_scene = "0.20.0-rc.1"
bevy_ui = "0.20.0-rc.1"
bevy_window = "0.20.0-rc.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
bevy_math = "0.20.0-rc.1"
bevy_time = "0.20.0-rc.1"
